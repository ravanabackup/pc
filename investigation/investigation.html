        return `<div class="schematic"><p class="kicker">Sheet 01 · host schematic</p><svg viewBox="0 0 640 360" width="100%" aria-hidden="true"><rect x="18" y="18" width="300" height="300" fill="none" stroke="currentColor" opacity=".65"/><g transform="translate(150 150)"><circle r="34" fill="none" stroke="#e4a15a"/><circle r="5" fill="#e4a15a"/></g><text x="118" y="196" fill="currentColor" font-size="10" font-family="IBM Plex Mono, monospace">${cores || "—"} THREADS</text>${sticks}<rect x="48" y="236" width="200" height="42" fill="none" stroke="#8ed9d0"/><text x="58" y="262" fill="#8ed9d0" font-size="11" font-family="IBM Plex Mono, monospace">${esc(gpu).slice(0, 28)}</text><text x="360" y="70" fill="#e4a15a" font-size="12" font-family="IBM Plex Mono, monospace">01 COMPUTE</text><text x="360" y="92" fill="currentColor" font-size="13" font-family="IBM Plex Mono, monospace">${cores ? cores + " logical" : "withheld"}</text><text x="360" y="132" fill="#e4a15a" font-size="12" font-family="IBM Plex Mono, monospace">02 MEMORY</text><text x="360" y="154" fill="currentColor" font-size="13" font-family="IBM Plex Mono, monospace">${memory != null ? memory + " GB bucket" : "not reported"}</text><text x="360" y="194" fill="#e4a15a" font-size="12" font-family="IBM Plex Mono, monospace">03 LINK</text><text x="360" y="216" fill="currentColor" font-size="13" font-family="IBM Plex Mono, monospace">${state.online ? "online" : "offline"}</text><text x="360" y="256" fill="#e4a15a" font-size="12" font-family="IBM Plex Mono, monospace">04 POWER</text><text x="360" y="278" fill="currentColor" font-size="13" font-family="IBM Plex Mono, monospace">${state.battery ? (state.battery.charging ? "charging" : "on battery") : "mains / unknown"}</text></svg><p class="faint mono" style="font-size:10px;letter-spacing:.16em;text-transform:uppercase">Schematic only — a page cannot photograph this chassis</p></div>`;

      function locationHtml() {
        const ip = state.ip, gps = state.gps;
        const canDevice = !!gps, canNetwork = !!(ip && ip.lat != null && ip.lon != null);
        const useDevice = state.picked === "network" ? false : canDevice;
        const primary = useDevice && gps ? { lat: gps.lat, lon: gps.lon, source: "gps", accuracy: gps.accuracy } : canNetwork ? { lat: ip.lat, lon: ip.lon, source: "ip" } : null;
        const points = [];
        if (canNetwork) points.push({ id: "NET", lat: ip.lat, lon: ip.lon });

        let plotted = points.map((p) => ({ ...p, x: 320, y: 150 }));
        if (points.length === 2) {
          const minLat = Math.min(points[0].lat, points[1].lat), maxLat = Math.max(points[0].lat, points[1].lat);
          const minLon = Math.min(points[0].lon, points[1].lon), maxLon = Math.max(points[0].lon, points[1].lon);
          const latSpan = Math.max(0.002, maxLat - minLat), lonSpan = Math.max(0.002, maxLon - minLon);
          plotted = points.map((p) => ({ ...p, x: 70 + ((p.lon - minLon) / lonSpan) * 500, y: 36 + ((maxLat - p.lat) / latSpan) * 230 }));
        }
        const line = plotted.length === 2 ? `<line x1="${plotted[0].x}" y1="${plotted[0].y}" x2="${plotted[1].x}" y2="${plotted[1].y}" stroke="#e4a15a" stroke-dasharray="4 5"/>` : "";
        const dots = plotted.map((p) => `<g><circle cx="${p.x}" cy="${p.y}" r="5" fill="${p.id === "DEV" ? "#8ed9d0" : "#e4a15a"}"/><text x="${p.x + 10}" y="${p.y + 4}" fill="#f4ecdf" font-size="11" font-family="IBM Plex Mono, monospace">${p.id}</text></g>`).join("");
        const delta = gps && canNetwork ? { km: haversineKm(ip.lat, ip.lon, gps.lat, gps.lon), bearing: bearingDeg(ip.lat, ip.lon, gps.lat, gps.lon) } : null;
        const systems = primary ? [["GIS decimal", signedDecimal(primary.lat, primary.lon)], ["DMS", toDMS(primary.lat, primary.lon)], ["UTM", toUTM(primary.lat, primary.lon)], ["Plus code", toPlusCode(primary.lat, primary.lon)], ["Geohash", toGeohash(primary.lat, primary.lon)], ["Maidenhead", toMaidenhead(primary.lat, primary.lon)]] : [];
        const pretty = primary ? { lat: Math.abs(primary.lat).toFixed(5), lon: Math.abs(primary.lon).toFixed(5), ns: primary.lat >= 0 ? "N" : "S", ew: primary.lon >= 0 ? "E" : "W" } : null;
        const pad = primary ? mapPad(primary.source, primary.accuracy) : 0.1;
        const zoom = primary && primary.source === "gps" ? 16 : 11;
        const disagree = ip && ip.timezone && state.dossier.summary.timezone && ip.timezone !== state.dossier.summary.timezone;
        return `<section class="section" id="place"><p class="kicker">Place</p><h2>Coordinates, both opinions.</h2><p class="lede">Network place is the ISP’s neighborhood. A device fix is the receiver, and it stays closed until you ask.</p><div class="place-grid" style="margin-top:18px"><div class="map-stack"><div class="graticule"><svg viewBox="0 0 640 320" width="100%" height="320">${line}${dots}${plotted.length ? "" : `<text x="320" y="160" text-anchor="middle" fill="#f4ecdf" opacity=".45" font-family="IBM Plex Mono, monospace">NO FIX</text>`}</svg><div class="cap"><span>Relative plot · not to world scale</span><span>${delta ? formatDistance(delta.km) : primary ? "single opinion" : "waiting"}</span></div></div><div class="atlas">${primary ? `<iframe title="OpenStreetMap of the primary fix" src="${osmEmbed(primary.lat, primary.lon, pad)}"></iframe>` : `<div style="height:280px;display:grid;place-items:center;color:var(--muted)">Atlas tiles appear once a coordinate exists.</div>`}<div class="cap"><span>Map data © OpenStreetMap contributors</span></div></div></div><div class="coord-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><div><span class="kicker">${primary && primary.source === "gps" ? "Device fix" : primary ? "Network estimate" : "No fix"}</span>${canDevice && canNetwork ? `<span class="toggle"><button type="button" data-act="src" data-src="device" class="${useDevice ? "on" : ""}">Device</button><button type="button" data-act="src" data-src="network" class="${useDevice ? "" : "on"}">Network</button></span>` : ""}</div>${primary ? `<button class="ghost" type="button" data-act="copy" data-text="${esc(signedDecimal(primary.lat, primary.lon))}">Copy pair</button>` : ""}</div>${pretty ? `<p class="big">${pretty.lat}<i>° ${pretty.ns}</i></p><p class="big">${pretty.lon}<i>° ${pretty.ew}</i></p>` : `<p class="big" style="color:var(--faint)">— —</p>`}<p class="muted" style="font-size:14px;line-height:1.5">${gps //www.openstreetmap.org/?mlat=${primary.lat}&mlon=${primary.lon}#map=${zoom}/${primary.lat}/${primary.lon}" target="_blank" rel="noreferrer">OpenStreetMap</a><a href="https://www.google.com/maps?q=${primary.lat},${primary.lon}" target="_blank" rel="noreferrer">Google Maps</a><a href="geo:${primary.lat},${primary.lon}">Geo URI</a></div>` : ""}</div></div></section>`;

      function page() {

        const mark = `<svg viewBox="0 0 32 32" width="36" height="36" aria-hidden="true"><rect x="1" y="1" width="30" height="30" fill="none" stroke="currentColor"/><circle cx="16" cy="16" r="5" fill="none" stroke="currentColor"/><path d="M16 4v5M16 23v5M4 16h5M23 16h5" stroke="currentColor"/></svg>`;
        const stepIndex = Math.max(0, STEPS.indexOf(state.step));

        else if (state.bootError && !state.dossier) heroLeft = `<p class="kicker">Interrupted</p><h1>The case<br>did not open.</h1><p class="lede">${esc(state.bootError)}</p><div class="actions"><button class="solid" type="button" data-act="rescan">Try again</button></div>`;
        else heroLeft = `<p class="kicker">Field note · ${esc(state.dossier.caseId)}</p><h1>What this<br>machine <em>admits.</em></h1><p class="lede">A local inquest of the computer this page is open on. Hardware, display, graphics, power, network place, and coordinates — only what the browser will volunteer.</p><div class="stamp">Local only<span style="display:block;margin-top:4px">${esc(state.dossier.caseId)}</span></div><div class="actions"><a class="solid" href="#place">Open coordinates</a><button class="ghost" type="button" data-act="rescan" ${state.rescanning ? "disabled" : ""}>${state.rescanning ? "Rescanning…" : "Rescan"}</button><button class="ghost" type="button" data-act="brief">${state.copied ? "Brief copied" : "Export brief"}</button></div>`;
        const s = state.dossier && state.dossier.summary;
        const metrics = s ? [["Class", s.deviceClass.replace("-class", ""), s.browser], ["System", s.os.split("·")[0].trim(), s.timezone], ["Compute", s.cores ? `${s.cores} threads` : "Withheld", s.memory], ["Adapter", s.gpu, s.hz], ["Panel", `${screen.width}×${screen.height}`, `${s.dpr}× pixel ratio`], ["Power", state.battery ? pct(state.battery.level) : "Unknown", state.battery ? (state.battery.charging ? "Charging" : "On battery") : state.online ? "Link up" : "Link down"]].map(([k, v, h]) => `<div class="metric"><div class="kicker">${esc(k)}</div><b>${esc(v)}</b><span>${esc(h)}</span></div>`).join("") : "";
        const admitted = s ? state.dossier.coverage.filter((c) => c.state === "admitted").length : 0;
        const pills = s ? `<span class="pill ok">${admitted}/${state.dossier.coverage.length} surfaces admitted</span>` + state.dossier.coverage.map((c) => `<span class="pill ${c.state === "admitted" ? "ok" : c.state === "partial" ? "partial" : ""}">${esc(c.name)}</span>`).join("") : "";

        return `<div class="watermark" aria-hidden="true">${wm}°</div><div class="tape no-print"><div class="tape-track"><span>${TAPE.repeat(2)}</span><span>${TAPE.repeat(2)}</span></div></div><header class="bar"><div class="wrap bar-row"><div class="brand">${mark}<div><strong>Meridian</strong><span class="kicker">Device inquest</span></div></div><div class="mono" style="text-align:center"><div class="faint" style="font-size:10px;letter-spacing:.2em">CASE</div><div>${s ? esc(state.dossier.caseId) : "MR-····-····"}</div></div><div style="display:flex;align-items:center;gap:14px"><div style="text-align:right"><div class="mono" id="clock">${time}</div><div class="faint mono" id="clock-date" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase">${date}</div></div><button class="ghost no-print" type="button" data-act="print">Print</button><button class="ghost no-print" type="button" data-act="json" ${s ? "" : "disabled"}>JSON</button></div></div></header><main class="wrap"><section class="hero"><div>${heroLeft}</div><div class="plate">${state.booting || state.rescanning ? `<div class="scanline"></div>` : ""}<div class="plate-inner">${chassisSvg()}</div></div></section>${s ? `<div class="metrics">${metrics}</div><p class="story">${esc(narrative())}</p><div class="pills">${pills}</div>${locationHtml()}<section class="section" id="doors"><p class="kicker">Closed doors</p><h2>Ask this PC for more.</h2><p class="lede">These open the browser’s own permission dialogs. Streams are stopped immediately. Ports are not opened. Nothing is uploaded.</p><div class="doors" style="margin-top:16px">${door("Cameras and mics", "Opens the devices only long enough to read their names, then releases every track. Nothing is recorded.", "media", "Name devices", state.media && state.media.error)}${door("Displays", "Window Management can list every monitor. Chromium only.", "displays", "Enumerate displays", state.displays && state.displays.error)}${door("Motion", "A two-second listen for accelerometer and orientation. Most desktops have nothing to say.", "motion", "Sample sensors", state.motion && state.motion.error)}${door("MIDI", "Controllers and musical ports. System exclusive is not requested.", "midi", "List MIDI", state.midi && state.midi.error)}${door("Installed fonts", "The operating system font catalog, if Local Font Access is allowed.", "fonts", "List local fonts", state.fonts && state.fonts.error)}${door("USB device", "Opens the browser chooser. The selected name is recorded here. The device is not claimed.", "usb", "Pick USB", state.picks.length ? state.picks[state.picks.length - 1].detail : "")}</div><div class="btnrow"><button class="ghost" type="button" data-act="hid">Pick HID</button><button class="ghost" type="button" data-act="serial">Pick serial</button><button class="ghost" type="button" data-act="pads">Refresh gamepads</button></div></section><section class="section" id="ledger"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:end"><div><p class="kicker">Ledger</p><h2>Every admitted field.</h2></div><label class="filter"><span class="kicker">Filter · press /</span><input id="dossier-filter" type="search" value="${esc(state.query)}" placeholder="GPU, timezone, permission…"></label></div><p class="faint mono" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase">${q ? `${visible.length} sections match` : `${sections.length} sections · ${sections.reduce((n, sec) => n + sec.rows.length, 0)} fields`}</p><div class="toc-row no-print">${visible.map((sec) => `<a href="#${esc(sec.id)}">${esc(sec.index)} ${esc(sec.title)}</a>`).join("")}</div><div class="ledger-grid"><aside class="toc no-print">${visible.map((sec) => `<a href="#${esc(sec.id)}">${esc(sec.index)} ${esc(sec.title)}</a>`).join("")}</aside><div style="display:grid;gap:14px">${visible.map(sectionHtml).join("") || `<p class="card" style="padding:24px">No field contains “${esc(state.query)}”.</p>`}</div></div></sectio       function render() {
        const y = window.scrollY;
        const filter = document.getElementById("dossier-filter");
        const focused = document.activeElement === filter;
        const caret = filter ? filter.selectionStart : null;
        document.getElementById("root").innerHTML = page();
        window.scrollTo(0, y);
        if (focused) {
          const next = document.getElementById("dossier-filter");
          if (next) { next.focus(); if (caret != null) next.setSelectionRange(caret, caret); }
        }
      }
      async function boot() {
        state.booting = !state.dossier;
        state.rescanning = !!state.dossier;
        render();
        try {
          const result = await investigate((label) => { state.step = label; if (state.booting) render(); });
          state.dossier = result.dossier;
          state.ip = result.ip;
          state.ipError = result.ipError;
          state.ipAt = new Date().toISOString();
          state.ipState = result.ip ? "ready" : "failed";
          if (result.battery) state.battery = result.battery;
          state.bootError = null;
          document.title = `Meridian · ${result.dossier.caseId}`;
        } catch (err) {
          state.bootError = err instanceof Error ? err.message : "The inquest failed.";
        } finally {
          state.booting = false;
          state.rescanning = false;
          render();
        }
      }
      async function runDoor(key, task) {
        state.busy = key; render();
        try { await task(); } finally { state.busy = null; render(); }
      }
      document.addEventListener("click", async (event) => {
        const btn = event.target.closest("[data-act]");
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === "print") window.print();
        if (act === "json" && state.dossier) download(`meridian-${state.dossier.caseId}.json`, JSON.stringify({ caseId: state.dossier.caseId, capturedAt: state.dossier.capturedAt, fingerprint: state.dossier.fingerprint, summary: state.dossier.summary, networkPlace: state.ip, deviceFix: state.gps, coverage: state.dossier.coverage, sections: allSections(), limits: LIMITS }, null, 2), "application/json");

          try { state.gps = await requestFix(); state.gpsState = "fixed"; }
          catch (err) { state.gpsState = err && err.code === 1 ? "denied" : err && err.code === 3 ? "timeout" : "error"; state.gpsMessage = geoErrorMessage(err); }

          if (!navigator.geolocation) { state.gpsMessage = "Geolocation is not available in this browser."; render(); return; }

          state.watchId = navigator.geolocation.watchPosition((pos) => { state.gps = toFix(pos); state.gpsState = "fixed"; state.gpsMessage = null; render(); }, (err) => { state.gpsState = err.code === 1 ? "denied" : "error"; state.gpsMessage = geoErrorMessage(err); render(); }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });

        if (act === "ip") {
          state.ipState = "pending"; render();
          const result = await lookupIp();
          state.ip = result.place; state.ipError = result.error; state.ipAt = new Date().toISOString(); state.ipState = result.place ? "ready" : "failed"; render();
        }
        if (act === "media") runDoor("media", async () => { state.media = await scanMedia(); });
        if (act === "displays") runDoor("displays", async () => { state.displays = await scanDisplays(); });
        if (act === "motion") runDoor("motion", async () => { state.motion = await sampleMotion(); });
        if (act === "midi") runDoor("midi", async () => { state.midi = await scanMidi(); });
        if (act === "fonts") runDoor("fonts", async () => { state.fonts = await scanLocalFonts(); });
        if (act === "usb" || act === "hid" || act === "serial") runDoor(act, async () => { const detail = await pickPeripheral(act); state.picks.push({ kind: act.toUpperCase(), detail }); });

      document.addEventListener("input", (event) => {

      document.addEventListener("keydown", (event) => {
